name: Android device and release verification

on:
  push:
    branches:
      - feat/full-driver-assistant-20261114
    paths:
      - "android/**"
      - ".github/workflows/android-release-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator-smoke:
    name: Android build, install and emulator startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: driversch-profit-calculator/package-lock.json
      - name: Build the exact web app assets for this commit
        working-directory: driversch-profit-calculator
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../android/app/src/main/assets
          cp -R dist/. ../android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools"
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Enable KVM acceleration permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and test debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
          mkdir -p ../android-qa-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../android-qa-artifacts/app-debug.apk
          sha256sum ../android-qa-artifacts/app-debug.apk > ../android-qa-artifacts/SHA256SUMS.txt
      - name: Install, launch, inspect logs and capture emulator screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          script: |
            set -euo pipefail
            mkdir -p android-qa-artifacts
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'
            adb install -r android-qa-artifacts/app-debug.apk
            adb shell pm path com.driverprofitcalculator.app | grep -q '^package:'
            adb shell am force-stop com.driverprofitcalculator.app || true
            adb shell monkey -p com.driverprofitcalculator.app 1
            sleep 15
            adb shell pidof com.driverprofitcalculator.app > android-qa-artifacts/app-process.txt
            adb shell dumpsys window > android-qa-artifacts/window.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml android-qa-artifacts/hierarchy.xml
            adb logcat -d -v brief > android-qa-artifacts/logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com[.]driverprofitcalculator[.]app" android-qa-artifacts/logcat.txt; then
              echo "Android app crash detected"
              exit 1
            fi
            adb exec-out screencap -p > android-qa-artifacts/startup.png
            test -s android-qa-artifacts/startup.png
            adb shell dumpsys package com.driverprofitcalculator.app | grep -E "versionCode=|versionName=" > android-qa-artifacts/package.txt
            test -s android-qa-artifacts/package.txt
            sha256sum android-qa-artifacts/app-debug.apk > android-qa-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: android-qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

  android-release:
    name: Signed release APK (only with owner-provided secrets)
    runs-on: ubuntu-latest
    env:
      ANDROID_RELEASE_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: driversch-profit-calculator/package-lock.json
      - name: Build the exact web app assets for this commit
        working-directory: driversch-profit-calculator
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../android/app/src/main/assets
          cp -R dist/. ../android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools"
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare owner-provided signing key
        if: env.ANDROID_RELEASE_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/driver-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/driver-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.ANDROID_RELEASE_CONFIGURED == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK"
          sha256sum "$APK"
          stat -c '%s bytes' "$APK"
      - name: Upload signed release APK
        if: env.ANDROID_RELEASE_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Explain missing release credentials
        if: env.ANDROID_RELEASE_CONFIGURED != 'true'
        run: |
          echo "Release APK intentionally not built: owner-provided signing secrets are not configured."
          echo "Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
