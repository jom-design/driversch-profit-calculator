name: Assistant foundation

on:
  push:
    branches:
      - feat/full-driver-assistant-20261114
    paths:
      - "driversch-profit-calculator/src/assistant/**"
      - "driversch-profit-calculator/src/App.tsx"
      - "driversch-profit-calculator/src/styles.css"
      - "driversch-profit-calculator/src/platform/**"
      - "driversch-profit-calculator/tests/assistant/**"
      - "driversch-profit-calculator/tests/platform/**"
      - "driversch-profit-calculator/package.json"
      - ".github/workflows/assistant-foundation.yml"
  pull_request:
    paths:
      - "driversch-profit-calculator/src/assistant/**"
      - "driversch-profit-calculator/src/App.tsx"
      - "driversch-profit-calculator/src/styles.css"
      - "driversch-profit-calculator/src/platform/**"
      - "driversch-profit-calculator/tests/assistant/**"
      - "driversch-profit-calculator/tests/platform/**"
      - "driversch-profit-calculator/package.json"
      - ".github/workflows/assistant-foundation.yml"

permissions:
  contents: read

jobs:
  assistant-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driversch-profit-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run assistant tests
        run: npm run test:assistant
      - name: Run complete test suite
        run: npm test
      - name: TypeScript project check
        run: npx tsc -b
      - name: Vite production build
        run: npm run build
