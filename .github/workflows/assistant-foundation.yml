name: Assistant foundation

on:
  push:
    branches:
      - feat/full-driver-assistant-20261114
    paths:
      - "driversch-profit-calculator/src/assistant/**"
      - "driversch-profit-calculator/src/App.tsx"
      - "driversch-profit-calculator/src/styles.css"
      - "driversch-profit-calculator/src/platform/**"
      - "driversch-profit-calculator/src/lib/**"
      - "driversch-profit-calculator/src/components/**"
      - "driversch-profit-calculator/src/types.ts"
      - "driversch-profit-calculator/tests/assistant/**"
      - "driversch-profit-calculator/tests/e2e/**"
      - "driversch-profit-calculator/tests/platform/**"
      - "driversch-profit-calculator/package.json"
      - "driversch-profit-calculator/package-lock.json"
      - ".github/workflows/assistant-foundation.yml"
      - "android/**"
  pull_request:
    paths:
      - "driversch-profit-calculator/src/assistant/**"
      - "driversch-profit-calculator/src/App.tsx"
      - "driversch-profit-calculator/src/styles.css"
      - "driversch-profit-calculator/src/platform/**"
      - "driversch-profit-calculator/src/lib/**"
      - "driversch-profit-calculator/src/components/**"
      - "driversch-profit-calculator/src/types.ts"
      - "driversch-profit-calculator/tests/assistant/**"
      - "driversch-profit-calculator/tests/e2e/**"
      - "driversch-profit-calculator/tests/platform/**"
      - "driversch-profit-calculator/package.json"
      - "driversch-profit-calculator/package-lock.json"
      - ".github/workflows/assistant-foundation.yml"
      - "android/**"

permissions:
  contents: read

jobs:
  assistant-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driversch-profit-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run assistant unit tests
        run: npm run test:assistant
      - name: TypeScript project check
        run: npx tsc -b
      - name: Vite production build
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run combined unit and browser test suite
        run: npm test

  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: driversch-profit-calculator/package-lock.json
      - name: Build offline web assets
        working-directory: driversch-profit-calculator
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../android/app/src/main/assets
          cp -R dist/. ../android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate and commit official Gradle 8.9 wrapper
        run: |
          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar || ! -f android/gradlew ]]; then
            gradle -p android wrapper --gradle-version 8.9 --distribution-type bin
            chmod +x android/gradlew
            if ! grep -q '^distributionSha256Sum=' android/gradle/wrapper/gradle-wrapper.properties; then
              sed -i '/^networkTimeout=/i distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab' android/gradle/wrapper/gradle-wrapper.properties
            fi
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/feat/full-driver-assistant-20261114" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
              if ! git diff --cached --quiet; then
                git commit -m "build(android): add official Gradle 8.9 wrapper"
                git push origin HEAD:feat/full-driver-assistant-20261114
              fi
            fi
          else
            echo "Official Gradle 8.9 wrapper already exists; keeping committed files unchanged."
          fi
      - uses: gradle/actions/wrapper-validation@v4
      - name: Test, lint, and assemble Android debug APK
        run: ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: driver-profit-calculator-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
