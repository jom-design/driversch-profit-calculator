name: Assistant foundation

on:
  push:
    branches:
      - feat/full-driver-assistant-20261114
    paths:
      - "driversch-profit-calculator/src/assistant/**"
      - "driversch-profit-calculator/src/App.tsx"
      - "driversch-profit-calculator/src/styles.css"
      - "driversch-profit-calculator/src/platform/**"
      - "driversch-profit-calculator/src/lib/**"
      - "driversch-profit-calculator/src/components/**"
      - "driversch-profit-calculator/src/**"
      - "driversch-profit-calculator/index.html"
      - "driversch-profit-calculator/tests/assistant/**"
      - "driversch-profit-calculator/tests/e2e/**"
      - "driversch-profit-calculator/tests/platform/**"
      - "driversch-profit-calculator/package.json"
      - "driversch-profit-calculator/package-lock.json"
      - ".github/workflows/assistant-foundation.yml"
      - "android/**"
  pull_request:
    paths:
      - "driversch-profit-calculator/src/assistant/**"
      - "driversch-profit-calculator/src/App.tsx"
      - "driversch-profit-calculator/src/styles.css"
      - "driversch-profit-calculator/src/platform/**"
      - "driversch-profit-calculator/src/lib/**"
      - "driversch-profit-calculator/src/components/**"
      - "driversch-profit-calculator/src/**"
      - "driversch-profit-calculator/index.html"
      - "driversch-profit-calculator/tests/assistant/**"
      - "driversch-profit-calculator/tests/e2e/**"
      - "driversch-profit-calculator/tests/platform/**"
      - "driversch-profit-calculator/package.json"
      - "driversch-profit-calculator/package-lock.json"
      - ".github/workflows/assistant-foundation.yml"
      - "android/**"

permissions:
  contents: read

jobs:
  assistant-foundation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: driversch-profit-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run assistant unit tests
        run: npm run test:assistant
      - name: TypeScript project check
        run: npx tsc -b
      - name: Vite production build
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run combined unit and browser test suite
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-screenshots-${{ github.run_id }}
          path: driversch-profit-calculator/test-results/layout
          if-no-files-found: warn

  android-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: driversch-profit-calculator/package-lock.json
      - name: Build offline web assets
        working-directory: driversch-profit-calculator
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../android/app/src/main/assets
          cp -R dist/. ../android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify the committed Gradle 8.9 wrapper
        run: |
          # The wrapper is committed. CI never generates or commits files, so a missing wrapper fails.
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradlew
      - uses: gradle/actions/wrapper-validation@v4
      - name: Test, lint, and assemble Android debug APK
        run: ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Summarize JUnit results
        if: always()
        run: |
          {
            echo "### JUnit results (testDebugUnitTest)"
            echo "| Suite | Tests | Failures | Errors | Skipped |"
            echo "| --- | --- | --- | --- | --- |"
            for f in android/app/build/test-results/testDebugUnitTest/TEST-*.xml; do
              [ -e "$f" ] || continue
              tag=$(grep -o '<testsuite [^>]*>' "$f" | head -n 1)
              attr() { grep -o " $1=\"[^\"]*\"" <<< "$tag" | head -n 1 | cut -d'"' -f2; }
              echo "| $(attr name) | $(attr tests) | $(attr failures) | $(attr errors) | $(attr skipped) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-testDebugUnitTest
          path: android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
      - name: Verify the APK contains the new launcher icon
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" > apk-contents.txt
          awk '{print $NF}' apk-contents.txt > apk-paths.txt
          for f in res/mipmap-anydpi-v26/ic_launcher.xml res/mipmap-anydpi-v26/ic_launcher_round.xml \
                   res/drawable/ic_launcher_foreground.xml res/drawable/ic_launcher_background.xml \
                   res/drawable/ic_launcher_monochrome.xml; do
            grep -qx "$f" apk-paths.txt || { echo "Missing $f in APK"; exit 1; }
          done
          # AGP may add a density qualifier such as mipmap-mdpi-v4, so the density folder is matched by pattern.
          # Byte-for-byte check: the APK must ship the exact PNGs committed in this repository.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for name in ic_launcher ic_launcher_round; do
              path=$(grep -E "^res/mipmap-${density}(-v[0-9]+)?/${name}\.png$" apk-paths.txt | head -1)
              [ -n "$path" ] || { echo "Missing $density/$name.png in APK"; grep mipmap apk-paths.txt; exit 1; }
              inapk=$(unzip -p "$apk" "$path" | sha256sum | cut -d' ' -f1)
              [ "$inapk" = "$(sha256sum android/app/src/main/res/mipmap-$density/$name.png | cut -d' ' -f1)" ] || { echo "APK icon differs: $density/$name"; exit 1; }
              echo "verified $path"
            done
          done
          echo "Icon resources verified in $apk"
      - uses: actions/upload-artifact@v4
        with:
          name: driver-profit-calculator-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
